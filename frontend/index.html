<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend AI Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .container {
            max-width: 700px;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
        }

        footer {
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="card p-4">

            <h2 class="text-center mb-3">
                Backend AI Contact API
            </h2>

            <p class="text-center text-secondary">
                Демонстрация REST API на FastAPI
            </p>

            <div id="status" class="alert alert-secondary text-center">
                Проверка сервиса...
            </div>

            <form id="contactForm">

                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input id="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input id="email"
                           type="email"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Телефон</label>
                    <input id="phone"
                           type="tel"
                           class="form-control"
                           pattern="^\+?[0-9]{10,15}$"
                           title="Введите номер в формате +79999999999"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Комментарий</label>
                    <textarea id="comment"
                              class="form-control"
                              rows="5"
                              required></textarea>
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Отправить
                </button>

            </form>

            <div id="result" class="mt-4"></div>

        </div>

        <footer class="text-center mt-4">
            FastAPI • OpenRouter AI • Gmail SMTP
        </footer>

    </div>

    <script>

        const API = "http://127.0.0.1:8000";

        async function checkHealth() {

            try {

                const response = await fetch(API + "/api/health");

                const status = document.getElementById("status");

                if (response.ok) {

                    status.className = "alert alert-success";
                    status.innerHTML = "🟢 API работает";

                } else {

                    status.className = "alert alert-danger";
                    status.innerHTML = "🔴 API недоступно";

                }

            } catch {

                const status = document.getElementById("status");

                status.className = "alert alert-danger";
                status.innerHTML = "🔴 Не удалось подключиться к серверу";

            }

        }

        document
            .getElementById("contactForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                const body = {

                    name: document.getElementById("name").value,

                    email: document.getElementById("email").value,

                    phone: document.getElementById("phone").value,

                    comment: document.getElementById("comment").value

                };

                const response = await fetch(API + "/api/contact", {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify(body)

                });

                const result = document.getElementById("result");

                if (response.status === 201) {

                    result.innerHTML = `
                        <div class="alert alert-success">
                            Сообщение успешно отправлено.
                        </div>
                    `;

                    document.getElementById("contactForm").reset();

                }

                else if (response.status === 429) {

                    result.innerHTML = `
                        <div class="alert alert-danger">
                            Слишком много запросов. Попробуйте позже.
                        </div>
                    `;

                }

                else {

                    const error = await response.json();

                    let message = "Произошла ошибка.";

                    if (Array.isArray(error.detail)) {

                        message = "";

                        error.detail.forEach(item => {

                            switch (item.loc[item.loc.length - 1]) {

                                case "name":
                                    message += "Введите имя.<br>";
                                    break;

                                case "email":
                                    message += "Некорректный адрес электронной почты.<br>";
                                    break;

                                case "phone":
                                    message += "Некорректный номер телефона.<br>";
                                    break;

                                case "comment":
                                    message += "Введите комментарий.<br>";
                                    break;

                                default:
                                    message += item.msg + "<br>";

                            }

                        });

                    }

                    else if (typeof error.detail === "string") {

                        message = error.detail;

                    }

                    result.innerHTML = `
                        <div class="alert alert-danger">
                            ${message}
                        </div>
                    `;

                }

            });

        checkHealth();

    </script>

</body>

</html>
