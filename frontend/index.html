<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Contact Form</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
        }

        .container {
            max-width: 700px;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        footer {
            color:#777;
            font-size:14px;
        }

    </style>

</head>


<body>


<div class="container py-5">


    <div class="card p-4">


        <h2 class="text-center mb-3">
            AI Contact Form
        </h2>


        <p class="text-center text-secondary">
            FastAPI + OpenRouter AI
        </p>



        <div id="status"
             class="alert alert-secondary text-center">

            Проверка сервера...

        </div>



        <form id="contactForm">


            <div class="mb-3">

                <label class="form-label">
                    Имя
                </label>

                <input 
                    id="name"
                    class="form-control"
                    placeholder="Введите имя"
                    required>

            </div>



            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    class="form-control"
                    placeholder="example@mail.com"
                    required>

            </div>



            <div class="mb-3">

                <label class="form-label">
                    Телефон
                </label>


                <input
                    id="phone"
                    class="form-control"
                    placeholder="+79999999999"
                    pattern="^\+?[0-9]{10,15}$"
                    required>

            </div>



            <div class="mb-3">

                <label class="form-label">
                    Комментарий
                </label>


                <textarea
                    id="comment"
                    class="form-control"
                    rows="5"
                    placeholder="Опишите ваш запрос"
                    required></textarea>


            </div>



            <button
                class="btn btn-primary w-100">

                Отправить

            </button>


        </form>



        <div id="result"
             class="mt-4">
        </div>


    </div>



    <footer class="text-center mt-4">

        FastAPI | OpenRouter AI | Gmail SMTP

    </footer>


</div>





<script>


// Render API
const API = "https://intlab.onrender.com";





async function checkHealth(){


    const status = document.getElementById("status");


    try{


        const response = await fetch(
            API + "/api/health"
        );


        if(response.ok){


            status.className =
                "alert alert-success text-center";


            status.innerHTML =
                "API работает";


        }
        else{


            status.className =
                "alert alert-danger text-center";


            status.innerHTML =
                "API недоступно";


        }


    }
    catch(error){


        status.className =
            "alert alert-danger text-center";


        status.innerHTML =
            "Не удалось подключиться к серверу";


    }


}





document
.getElementById("contactForm")
.addEventListener(
"submit",
async function(e){


    e.preventDefault();



    const result =
        document.getElementById("result");



    const data = {


        name:
        document.getElementById("name").value,


        email:
        document.getElementById("email").value,


        phone:
        document.getElementById("phone").value,


        comment:
        document.getElementById("comment").value


    };



    try{


        const response = await fetch(

            API + "/api/contact",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },


                body:
                JSON.stringify(data)

            }

        );




        if(response.status === 201){


            result.innerHTML = `

            <div class="alert alert-success">

            Сообщение успешно отправлено.

            </div>

            `;


            document
            .getElementById("contactForm")
            .reset();


            return;


        }




        if(response.status === 429){


            result.innerHTML = `

            <div class="alert alert-warning">

            Слишком много запросов.

            Попробуйте позже.

            </div>

            `;


            return;

        }





        const error =
            await response.json();



        let message =
            "Ошибка отправки";




        if(Array.isArray(error.detail)){


            message =
            error.detail
            .map(
                e => e.msg
            )
            .join("<br>");


        }


        else if(error.detail){


            message =
            error.detail;


        }





        result.innerHTML = `

        <div class="alert alert-danger">

        ${message}

        </div>

        `;



    }

    catch(error){


        result.innerHTML = `

        <div class="alert alert-danger">

        Сервер недоступен.

        </div>

        `;


    }



});





checkHealth();



</script>



</body>

</html>
